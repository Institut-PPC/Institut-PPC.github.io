association:
  surtitre: L’Association
  titre: Porter la PPC dans une logique d’intérêt général
  texte:
    - >-
      L’Association pour la Pérennité Programmée Circulaire développe et diffuse
      les principes de la PPC, administre sa marque collective et veille à l’intégrité
      du corpus méthodologique et scientifique qui lui est associé.
