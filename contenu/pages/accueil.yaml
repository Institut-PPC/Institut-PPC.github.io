titre_page: Pérennité Programmée Circulaire — PPC
description: >-
  Découvrir la Pérennité Programmée Circulaire : une démarche pour faire de la
  durabilité, de la réparabilité et de la préservation de la valeur des leviers
  de performance industrielle et économique.

hero:
  surtitre: Pour une économie qui crée de la valeur en conservant la valeur
  titre_lignes:
    - Pérennité
    - Programmée
    - Circulaire
  introduction:
    - >-
      La Pérennité Programmée Circulaire (PPC) est un modèle commercial, industriel et économique systémique d’intérêt général 
      qui organise la conservation de la valeur des biens, des composants, des matières, des infrastructures et des savoirs 
      dans le temps.
    - >-
      Elle vise à rendre économiquement préférable la conservation de la valeur plutôt que le renouvellement permanent des biens. 
      Elle articule Conception démontable, Vente à l’usage, Organisation industrielle circulaire et Gestion par composants.

pourquoi:
  surtitre: Pourquoi la PPC ?
  titre: Faire de la conservation de la valeur un avantage compétitif
  introduction:
    - >-
      Dans un monde confronté à la raréfaction des ressources, aux enjeux de
      décarbonation et de souveraineté industrielle, renouveler toujours plus vite
      les biens n’est plus une réponse soutenable.
  principes:
    - numero: "01"
      titre: Concevoir pour démonter, faire évoluer et remanufacturer
      texte: >-
        Des biens robustes, modulaires, démontables et réversibles, conçus pour permettre 
        la maintenance, la réparation, l’évolution, le réemploi des composants et la remanufacture.

    - numero: "02"
      titre: Vendre l’usage plutôt que multiplier les ventes de biens
      texte: >-
        Le producteur ou l’opérateur conserve la propriété de l’actif et commercialise une performance 
        d’usage dans le cadre d’une convention à engagements réciproques. Sa performance économique 
        dépend alors de la robustesse, de la maintenabilité et de la conservation de la valeur de l’équipement.

    - numero: "03"
      titre: Organiser une chaîne de valeur circulaire territorialisée
      texte: >-
        Maintenance, réparation, réemploi et remanufacture sont organisés au plus près des usages grâce à des 
        écosystèmes territoriaux associant industriels, mainteneurs, acteurs de l’ESS, organismes de formation, 
        collectivités et financeurs. Cette organisation crée de l’emploi, de la formation, de l’insertion et 
        de nouvelles capacités industrielles locales.

idee_ppc:
  surtitre: L’idée PPC
  titre: Créer plus de valeur en conservant ce qui en a déjà
  texte_principal:
    - >-
      La Pérennité Programmée Circulaire inverse la logique du renouvellement
      permanent : plutôt que de dépendre de la vente répétée de biens neufs, elle
      cherche à rendre économiquement avantageux le fait de conserver leur valeur
      dans le temps.
  texte_complementaire:
    - >-
      Cela suppose de concevoir des biens robustes, réparables et évolutifs, mais
      aussi d’organiser les modèles économiques, la coopération, la gestion, la 
      comptabilité et le financement pour que leur durée devienne une source de performance.

cadre_concret:
  surtitre: Du concept au cadre concret
  titre: Une démarche collective, une marque et des référentiels
  texte:
    - >-
      L’Association pour la Pérennité Programmée Circulaire structure et protège un
      corpus méthodologique, scientifique et technique commun. La marque collective
      PPC et ses référentiels ont vocation à rendre cette démarche identifiable,
      cohérente et vérifiable.

contribuer:
  surtitre: Travailler avec nous
  titre: Faire progresser la PPC à partir de situations réelles
  introduction:
    - >-
      Entreprises, industriels, institutions et experts peuvent contribuer aux
      travaux collectifs de l'association. 
    - >-
      Les travaux de l’Association portent notamment sur l’évolution des référentiels 
      commerciaux, industriels, économiques, comptables, financiers et juridiques nécessaires 
      à l’économie de l’usage. Ils étudient en particulier la reconnaissance et le financement 
      d’actifs dont la valeur peut être conservée sur le temps long : composants, 
      Matières Premières Pérennes (MPP), Génie Civil Pérenne (GCP) et Savoirs Opérationnels Pérennes (SOP).

approfondir:
  surtitre: Pour approfondir
  titre: Comprendre les fondements et les travaux de la PPC
  introduction:
    - >-
      Publications, ouvrages, vidéos, formations et travaux de l'association permettent
      d’approfondir les dimensions industrielles, économiques, comptables et
      systémiques de la démarche.

