titre_page: Pérennité Programmée Circulaire — PPC
description: >-
  Découvrir la Pérennité Programmée Circulaire : une démarche pour faire de la
  durabilité, de la réparabilité et de la préservation de la valeur des leviers
  de performance industrielle et économique.

hero:
  surtitre: Pour une économie qui crée de la valeur en faisant durer
  titre_lignes:
    - Pérennité
    - Programmée
    - Circulaire
  introduction: >-
    La PPC propose de concevoir et d’organiser les biens, les services et les
    modèles économiques pour préserver durablement leur valeur, leurs performances
    et les ressources déjà mobilisées.

pourquoi:
  surtitre: Pourquoi la PPC ?
  titre: Faire de la durée un avantage plutôt qu’une contrainte
  introduction: >-
    Dans un monde confronté à la raréfaction des ressources, aux enjeux de
    décarbonation et de souveraineté industrielle, renouveler toujours plus vite
    les biens n’est plus une réponse soutenable.
  principes:
    - numero: "01"
      titre: Concevoir pour durer
      texte: >-
        Des biens modulaires, démontables, réparables et évolutifs, pensés pour
        conserver leurs performances dans le temps.

    - numero: "02"
      titre: Créer de la valeur par l’usage
      texte: >-
        Des modèles économiques où la qualité du service rendu et la durée d’usage
        comptent davantage que la multiplication des ventes de produits neufs.

    - numero: "03"
      titre: Préserver les ressources et les savoirs
      texte: >-
        Maintenance, remanufacturage, réemploi et gestion dans le temps permettent
        de conserver la valeur des composants, des matières, des infrastructures
        et des savoirs déjà constitués.

idee_ppc:
  surtitre: L’idée PPC
  titre: Créer plus de valeur en conservant ce qui en a déjà
  texte_principal: >-
    La Pérennité Programmée Circulaire inverse la logique du renouvellement
    permanent : plutôt que de dépendre de la vente répétée de biens neufs, elle
    cherche à rendre économiquement avantageux le fait de conserver leur valeur
    dans le temps.
  texte_complementaire: >-
    Cela suppose de concevoir des biens robustes, réparables et évolutifs, mais
    aussi d’organiser les modèles économiques, la coopération, la gestion, la 
    comptabilité et le financement pour que leur durée devienne une source de performance.

cadre_concret:
  surtitre: Du concept au cadre concret
  titre: Une démarche collective, une marque et des référentiels
  texte: >-
    L’Association pour la Pérennité Programmée Circulaire structure et protège un
    corpus méthodologique, scientifique et technique commun. La marque collective
    PPC et ses référentiels ont vocation à rendre cette démarche identifiable,
    cohérente et vérifiable.

contribuer:
  surtitre: Travailler avec nous
  titre: Faire progresser la PPC à partir de situations réelles
  introduction: >-
    Entreprises, industriels, institutions et experts peuvent contribuer aux
    travaux collectifs de l'association. Les études actuellement menées explorent notamment
    la manière dont la comptabilité, le financement et la gestion des actifs
    peuvent mieux reconnaître la valeur conservée dans le temps.

approfondir:
  surtitre: Pour approfondir
  titre: Comprendre les fondements et les travaux de la PPC
  introduction: >-
    Publications, ouvrages, vidéos, formations et travaux de l'association permettent
    d’approfondir les dimensions industrielles, économiques, comptables et
    systémiques de la démarche.

ressources_mises_en_avant:
  - la-perennite-programmee-circulaire-sator
  - faconner-une-industrie-circulaire-robuste

mouvement:
  surtitre: La PPC en mouvement
  titre: Travaux, actualités et rendez-vous
  introduction: >-
    Suivre les avancées de l’Association, les publications liées à la PPC et les
    événements auxquels elle participe.

association:
  surtitre: L’Association
  titre: Porter la PPC dans une logique d’intérêt général
  texte: >-
    L’Association pour la Pérennité Programmée Circulaire développe et diffuse
    les principes de la PPC, administre sa marque collective et veille à l’intégrité
    du corpus méthodologique et scientifique qui lui est associé.
