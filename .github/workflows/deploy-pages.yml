name: Valider et déployer le site sur GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 1 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Qualité et build Astro
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v7

      - name: Installer, contrôler, construire et téléverser l’artifact
        uses: withastro/action@v6
        with:
          node-version: 22.12.0
          package-manager: npm
          build-cmd: npm run ci
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io

  deploy:
    name: Déployer sur GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier l’artifact Astro
        id: deployment
        uses: actions/deploy-pages@v5
